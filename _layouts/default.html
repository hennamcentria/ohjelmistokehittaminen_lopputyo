
<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      background: #111111;
      font-family: Arial, sans-serif;
      color: #805063;
      padding: 14px;
    }

    .container {
      max-width: 768px;
      margin: auto;
      background: #fff0f6;
      padding: 12px;
      border-radius: 12px;
    }

    /* Markdownin ensimmäinen otsikko */
    .content h2:first-of-type {
      background: #f5b1d7;
      color: #874761;
      text-align: center;
      padding: 18px 12px;
      border-radius: 10px;
      font-size: 17px;
      margin: 0;
    }

    /* Alaotsikko */
    .content h2:first-of-type + p {
      background: #f5b1d7;
      text-align: center;
      padding: 0 12px 14px;
      margin: -5px 0 8px;
      border-radius: 0 0 10px 10px;
      font-size: 13px;
    }

    /* Tehtävien otsikot */
    .content h2:not(:first-of-type) {
      color: #e83e8c;
      font-size: 16px;
      margin-top: 8px;
    }

    .content {
      background: #fffafd;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <div class="container">
    <main class="content">
      {{ content }}
    </main>
  </div>
</body>
</html>
